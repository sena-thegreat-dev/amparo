<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Entrar | Amparo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../style/core.css">
    <link rel="stylesheet" href="../style/acesso.css">
    <link rel="shortcut icon" href="../img/icon.svg" type="image/x-icon">
</head>

<body>
    <div class="access-shell">
        <aside class="access-aside"><a class="brand" href="../index.html">♡ amparo</a>
            <div>
                <p>área protegida</p>
                <h1>Seu cuidado, no lugar certo.</h1>
                <p>Entre como família, profissional ou administração.</p>
            </div>
        </aside>
        <main class="access-main">
            <section class="access-card">
                <h2>Entrar</h2>
                <p id="msg">Escolha seu perfil para acessar sua área.</p>
                <div class="role-switch">
                    <button class="active" type="button" data-role="family">Sou usuário</button>
                    <button type="button" data-role="caregiver">Sou cuidador</button>
                    <button type="button" data-role="admin">Admin</button>
                </div>
                <form data-access-form><input id="role" name="role" type="hidden" value="family"><label><span
                            id="credential-label">CPF</span><input id="credential" name="credential" required
                            autocomplete="username"></label><label>Senha<input name="password" type="password" required
                            autocomplete="current-password"></label>
                    <p id="access-error" class="error"></p>
                    <div class="submit-row"><button class="button" type="submit">Entrar</button><a
                            href="cadastro-usuario.html">Criar cadastro</a></div>
                </form>
            </section>
        </main>
    </div>
    <script src="../js/acesso.js"></script>
    <script>if (location.search.includes('cadastro=ok')) document.querySelector('#msg').textContent = 'Cadastro enviado. Entre para continuar.';</script>
</body>

</html>
